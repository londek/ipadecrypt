version: "2"
linters:
  enable:
    - wsl_v5
  disable:
    - errcheck
  exclusions:
    # internal/apphttp, internal/store, internal/sap and internal/storeauth are
    # based on ipatool's App Store engine (see README "Prior art") and use
    # its formatting conventions rather than this project's lint rules.
    paths:
      - internal/apphttp/
      - internal/store/
      - internal/sap/
      - internal/storeauth/
